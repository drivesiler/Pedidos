<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfumería Kanam - Catálogo de Pedidos</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-black text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <h1 class="text-xl md:text-2xl font-bold tracking-wider">PERFUMERÍA KANAM</h1>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openAdminModal()" class="text-gray-400 hover:text-white p-2 transition" title="Administración">
                    <i class="fa-solid fa-lock text-lg"></i>
                </button>
                <button onclick="toggleCart()" class="relative bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg flex items-center space-x-2 transition shadow-md">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="hidden md:inline">Ver Pedido</span>
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- Buscador y Filtros -->
        <div class="mb-8 flex flex-col md:flex-row gap-4 justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <div class="w-full md:w-1/2 relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"></i>
                <input type="text" id="search-input" placeholder="Buscar perfume por nombre..." oninput="filterProducts()" class="w-full pl-12 pr-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-black">
            </div>
            <div class="w-full md:w-1/3">
                <select id="category-select" onchange="filterProducts()" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-black bg-white">
                    <option value="">Todas las Marcas</option>
                </select>
            </div>
        </div>

        <!-- Grid de Productos -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Los productos se generan aquí automáticamente -->
        </div>
    </main>

    <!-- Modal / Drawer del Carrito -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col transform transition-transform">
            <div class="p-4 bg-black text-white flex justify-between items-center">
                <h2 class="text-lg font-bold"><i class="fa-solid fa-bag-shopping mr-2"></i> Tu Pedido</h2>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            
            <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Ítems del carrito -->
            </div>

            <div class="p-4 border-t bg-gray-50 space-y-2">
                <div class="flex justify-between text-lg font-bold mb-2">
                    <span>Total estimado:</span>
                    <span id="cart-total" class="text-emerald-600">$0.00</span>
                </div>
                <button onclick="sendWhatsAppOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold flex items-center justify-center space-x-2 transition shadow-lg">
                    <i class="fa-brands fa-whatsapp text-xl"></i>
                    <span>Enviar Pedido por WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Administración -->
    <div id="admin-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl relative">
            <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black text-2xl">&times;</button>
            <h3 class="text-xl font-bold mb-4 flex items-center"><i class="fa-solid fa-user-shield mr-2 text-emerald-600"></i> Panel de Administración</h3>
            
            <!-- Login Form -->
            <div id="admin-login" class="space-y-4">
                <p class="text-sm text-gray-600">Ingresa la contraseña para gestionar los productos:</p>
                <input type="password" id="admin-pass-input" placeholder="Contraseña de administrador" class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-600">
                <button onclick="checkAdminPass()" class="w-full bg-black hover:bg-gray-800 text-white py-3 rounded-xl font-bold transition">Ingresar</button>
            </div>

            <!-- Admin Controls (Oculto por defecto) -->
            <div id="admin-controls" class="hidden space-y-6">
                <!-- Agregar Producto -->
                <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-200">
                    <h4 class="font-bold text-sm text-emerald-900 mb-3"><i class="fa-solid fa-plus-circle text-emerald-600 mr-1"></i> Agregar Nuevo Perfume</h4>
                    <form id="add-product-form" onsubmit="addNewProduct(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input type="text" id="new-name" placeholder="Nombre del perfume" required class="px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600">
                        <input type="text" id="new-category" placeholder="Marca (ej. Lattafa, Assala)" required class="px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600">
                        <input type="number" step="0.01" id="new-price" placeholder="Precio ($)" required class="px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600">
                        <input type="url" id="new-image" placeholder="URL de la imagen" required class="px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600">
                        <button type="submit" class="sm:col-span-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-sm flex items-center justify-center">
                            <i class="fa-solid fa-cloud-arrow-up mr-1"></i> Publicar Nuevo Producto
                        </button>
                    </form>
                </div>

                <!-- Botón de Reset -->
                <div class="border-t pt-4 flex justify-between items-center">
                    <span class="text-xs text-gray-500">¿Quieres volver a los productos por defecto?</span>
                    <button onclick="resetProducts()" class="text-xs text-red-600 hover:underline font-bold">Restablecer Catálogo</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Principal -->
    <script>
        // Lista base de productos
        const defaultProducts = [
            { id: 100536, name: "Freeze Cranby", price: 21.0, category: "Assala", image: "https://perfumeriakanam.com/wp-content/uploads/2026/10/71824_perfume-assala-prime-freeze-cranby-eau-de-parfum_z1_639155845222252786-300x300.webp" },
            { id: 100535, name: "Freeze Berry", price: 21.0, category: "Assala", image: "https://perfumeriakanam.com/wp-content/uploads/2026/10/71887_assala-freeze-berry-eau-de-parfum-85ml_l1_639155852177245848-300x300.webp" },
            { id: 100534, name: "Opulent Dubai", price: 19.5, category: "Lattafa", image: "https://perfumeriakanam.com/wp-content/uploads/2026/10/ChatGPTImageJan13_2026_03_47_26PM-300x300.png" }
        ];

        let products = JSON.parse(localStorage.getItem('kanam_products')) || defaultProducts;
        let cart = {};
        const ADMIN_PASS = "kanam2026";

        function init() {
            initCategories();
            renderProducts(products);
        }

        function initCategories() {
            const select = document.getElementById('category-select');
            select.innerHTML = '<option value="">Todas las Marcas</option>';
            const categories = [...new Set(products.map(p => p.category))].filter(Boolean);
            categories.sort().forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            if(items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">No se encontraron perfumes.</div>`;
                return;
            }

            items.forEach(product => {
                const qty = cart[product.id] ? cart[product.id].quantity : 0;
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between transition hover:shadow-md";
                card.innerHTML = `
                    <div>
                        <div class="h-48 bg-gray-100 overflow-hidden flex items-center justify-center p-2">
                            <img src="${product.image}" alt="${product.name}" class="h-full object-contain" onerror="this.src='https://via.placeholder.com/300?text=Perfumeria+Kanam'">
                        </div>
                        <div class="p-4">
                            <span class="text-xs font-semibold text-emerald-600 uppercase tracking-wider">${product.category}</span>
                            <h3 class="font-bold text-gray-800 text-lg mt-1 line-clamp-1">${product.name}</h3>
                            <p class="text-xl font-black text-gray-900 mt-2">$${product.price.toFixed(2)}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0">
                        ${qty === 0 ? `
                            <button onclick="updateQuantity('${product.id}', 1)" class="w-full bg-black hover:bg-gray-800 text-white py-2 rounded-lg font-medium transition flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-cart-plus"></i><span>Agregar</span>
                            </button>
                        ` : `
                            <div class="flex items-center justify-between bg-gray-100 rounded-lg p-1">
                                <button onclick="updateQuantity('${product.id}', -1)" class="w-10 h-10 bg-white rounded-md shadow-sm font-bold hover:bg-gray-200">-</button>
                                <span class="font-bold text-lg">${qty}</span>
                                <button onclick="updateQuantity('${product.id}', 1)" class="w-10 h-10 bg-white rounded-md shadow-sm font-bold hover:bg-gray-200">+</button>
                            </div>
                        `}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const category = document.getElementById('category-select').value;

            const filtered = products.filter(p => {
                const matchesQuery = p.name.toLowerCase().includes(query);
                const matchesCategory = category === "" || p.category === category;
                return matchesQuery && matchesCategory;
            });

            renderProducts(filtered);
        }

        function updateQuantity(productId, change) {
            const product = products.find(p => p.id == productId);
            if (!product) return;

            if (!cart[productId]) {
                if (change > 0) cart[productId] = { ...product, quantity: 1 };
            } else {
                cart[productId].quantity += change;
                if (cart[productId].quantity <= 0) delete cart[productId];
            }

            filterProducts();
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const badge = document.getElementById('cart-badge');
            const totalEl = document.getElementById('cart-total');
            
            container.innerHTML = '';
            let totalItems = 0;
            let totalPrice = 0;

            const ids = Object.keys(cart);
            if (ids.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-12">Tu carrito está vacío</p>`;
                badge.textContent = '0';
                totalEl.textContent = '$0.00';
                return;
            }

            ids.forEach(id => {
                const item = cart[id];
                totalItems += item.quantity;
                totalPrice += item.price * item.quantity;

                const div = document.createElement('div');
                div.className = "flex items-center justify-between border-b pb-3";
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <img src="${item.image}" class="w-12 h-12 object-contain bg-gray-50 rounded" alt="" onerror="this.src='https://via.placeholder.com/300?text=Perfumeria+Kanam'">
                        <div>
                            <h4 class="font-bold text-sm line-clamp-1">${item.name}</h4>
                            <p class="text-xs text-gray-500">$${item.price.toFixed(2)} x ${item.quantity}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="font-bold text-emerald-600">$${(item.price * item.quantity).toFixed(2)}</span>
                        <button onclick="updateQuantity('${item.id}', -1)" class="text-red-500 hover:text-red-700 p-1"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });

            badge.textContent = totalItems;
            totalEl.textContent = `$${totalPrice.toFixed(2)}`;
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        function sendWhatsAppOrder() {
            const ids = Object.keys(cart);
            if (ids.length === 0) {
                alert("Agrega al menos un producto a tu pedido.");
                return;
            }

            let message = "Hola! 🛍️ Me gustaría realizar el siguiente pedido en Perfumería Kanam:\n\n";
            let total = 0;

            ids.forEach(id => {
                const item = cart[id];
                const subtotal = item.price * item.quantity;
                total += subtotal;
                message += `▪️ *${item.name}* (x${item.quantity}) - $${subtotal.toFixed(2)}\n`;
            });

            message += `\n*Total a pagar: $${total.toFixed(2)}*\n\n¡Quedo atento a la confirmación!`;

            const phoneNumber = "584120000000";
            const url = `https://api.whatsapp.com/send?phone=${phoneNumber}&text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        /* Funciones de Administración */
        function openAdminModal() {
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function checkAdminPass() {
            const input = document.getElementById('admin-pass-input').value;
            if (input === ADMIN_PASS) {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-controls').classList.remove('hidden');
            } else {
                alert("Contraseña incorrecta");
            }
        }

        function addNewProduct(e) {
            e.preventDefault();
            const name = document.getElementById('new-name').value;
            const category = document.getElementById('new-category').value;
            const price = parseFloat(document.getElementById('new-price').value);
            const image = document.getElementById('new-image').value;

            const newProd = {
                id: Date.now(),
                name,
                category,
                price,
                image
            };

            // Insertar al inicio para que aparezca de primero
            products.unshift(newProd);
            localStorage.setItem('kanam_products', JSON.stringify(products));

            document.getElementById('add-product-form').reset();
            initCategories();
            renderProducts(products);
            alert("¡Producto agregado exitosamente!");
        }

        function resetProducts() {
            if (confirm("¿Estás seguro de restablecer el catálogo a la lista por defecto?")) {
                localStorage.removeItem('kanam_products');
                products = [...defaultProducts];
                initCategories();
                renderProducts(products);
                alert("Catálogo restablecido.");
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
