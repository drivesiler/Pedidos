<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfumería Kanam - Catálogo Web</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Header / Barra Superior -->
    <header class="bg-black text-white sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-spray-can text-amber-400 text-xl"></i>
                <h1 class="text-lg md:text-2xl font-bold tracking-widest text-amber-400">PERFUMERÍA KANAM</h1>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openAdminModal()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-600 px-3 py-1.5 rounded-lg text-xs md:text-sm flex items-center space-x-1.5 transition">
                    <i class="fa-solid fa-lock text-amber-400"></i>
                    <span>Admin</span>
                </button>
                <button onclick="toggleCart()" class="relative bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-bold flex items-center space-x-2 transition shadow-md">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Ver Pedido</span>
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-red-500 text-white text-[11px] w-5 h-5 rounded-full flex items-center justify-center font-bold shadow">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-2 sm:px-4 py-4 flex-1 w-full">
        <!-- Buscador y Categorías -->
        <div class="mb-4 bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col sm:flex-row gap-2 sm:gap-4 justify-between items-center">
            <div class="w-full sm:w-2/3 relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400"></i>
                <input type="text" id="search-input" placeholder="Buscar por nombre o marca..." oninput="filterProducts()" class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black text-xs sm:text-sm">
            </div>
            <div class="w-full sm:w-1/3">
                <select id="category-select" onchange="filterProducts()" class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black bg-white text-xs sm:text-sm">
                    <option value="">Todas las Marcas</option>
                </select>
            </div>
        </div>

        <!-- Grid de Productos (2 por fila en móvil) -->
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 sm:gap-4">
            <!-- Carga Dinámica -->
        </div>
    </main>

    <!-- Modal / Sidebar del Carrito -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col">
            <div class="p-4 bg-black text-white flex justify-between items-center">
                <h2 class="text-base font-bold flex items-center"><i class="fa-solid fa-bag-shopping mr-2 text-emerald-400"></i> Mi Pedido</h2>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
            </div>
            
            <div id="cart-items" class="flex-1 overflow-y-auto p-3 space-y-3">
                <!-- Ítems agregados -->
            </div>

            <div class="p-4 border-t bg-gray-50 space-y-2">
                <div class="flex justify-between text-base font-bold mb-1">
                    <span>Total estimado:</span>
                    <span id="cart-total" class="text-emerald-600">$0.00</span>
                </div>
                <button onclick="sendWhatsAppOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-bold text-sm flex items-center justify-center space-x-2 transition shadow">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    <span>Enviar por WhatsApp</span>
                </button>
                <button onclick="sendEmailOrder()" class="w-full bg-sky-600 hover:bg-sky-700 text-white py-2.5 rounded-xl font-bold text-sm flex items-center justify-center space-x-2 transition shadow">
                    <i class="fa-solid fa-envelope text-lg"></i>
                    <span>Enviar por Correo</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modulo Admin Pantalla Completa -->
    <div id="admin-modal" class="fixed inset-0 bg-gray-900 z-50 hidden overflow-y-auto">
        <div class="min-h-screen w-full bg-gray-100 flex flex-col">
            <div class="bg-black text-white p-4 px-6 flex justify-between items-center sticky top-0 z-10 shadow-md">
                <h3 class="text-base sm:text-lg font-bold flex items-center">
                    <i class="fa-solid fa-user-shield text-amber-400 mr-2"></i> Panel de Administración - Perfumería Kanam
                </h3>
                <button onclick="closeAdminModal()" class="text-gray-400 hover:text-white text-3xl font-light">&times;</button>
            </div>

            <div class="p-3 sm:p-6 max-w-5xl mx-auto w-full flex-1">
                <!-- Autenticación Admin -->
                <div id="admin-login-box" class="max-w-md mx-auto my-12 bg-white p-6 rounded-2xl border border-gray-200 shadow-md space-y-4">
                    <div class="text-center">
                        <i class="fa-solid fa-shield-halved text-4xl text-amber-500 mb-2"></i>
                        <h4 class="font-bold text-gray-800">Acceso Requerido</h4>
                        <p class="text-xs text-gray-500">Ingresa la clave para administrar inventarios:</p>
                    </div>
                    <form onsubmit="event.preventDefault(); checkAdminPass();" class="space-y-3">
                        <input type="password" id="admin-pass-input" placeholder="Contraseña..." class="w-full p-2.5 border rounded-xl focus:outline-none focus:ring-2 focus:ring-black text-sm">
                        <button type="submit" class="w-full bg-black text-white py-2.5 rounded-xl font-bold text-sm hover:bg-gray-800 transition">Ingresar</button>
                    </form>
                </div>

                <!-- Panel de Control Admin -->
                <div id="admin-content-box" class="hidden space-y-6">
                    <!-- Formulario Nuevo Producto -->
                    <div class="bg-emerald-50 p-4 sm:p-5 rounded-2xl border border-emerald-200 shadow-sm">
                        <h4 class="font-bold text-sm text-emerald-900 mb-3 flex items-center">
                            <i class="fa-solid fa-square-plus text-emerald-600 text-base mr-2"></i> Agregar Nuevo Perfume
                        </h4>
                        <form id="add-product-form" onsubmit="addNewProduct(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <input type="text" id="new-name" placeholder="Nombre del perfume" required class="px-3 py-2 border rounded-lg text-xs sm:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600">
                            <input type="text" id="new-category" placeholder="Marca / Categoría" required class="px-3 py-2 border rounded-lg text-xs sm:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600">
                            <input type="number" step="0.01" id="new-price" placeholder="Precio ($)" required class="px-3 py-2 border rounded-lg text-xs sm:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600">
                            <input type="url" id="new-image" placeholder="URL de imagen (https://...)" required class="px-3 py-2 border rounded-lg text-xs sm:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600">
                            <button type="submit" class="sm:col-span-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs sm:text-sm transition shadow flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <span>Publicar Perfume</span>
                            </button>
                        </form>
                    </div>

                    <!-- Buscador & Gestión del Inventario -->
                    <div class="bg-white p-4 sm:p-5 rounded-2xl border border-gray-200 shadow-sm space-y-4">
                        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 border-b pb-3">
                            <h4 class="font-bold text-sm text-gray-800 flex items-center">
                                <i class="fa-solid fa-boxes-stacked text-gray-600 text-base mr-2"></i> Inventario Actual (<span id="admin-total-count">0</span>)
                            </h4>
                            <input type="text" id="admin-search-input" oninput="renderAdminList()" placeholder="Filtrar en admin..." class="px-3 py-1.5 border rounded-lg text-xs w-full sm:w-64 focus:outline-none focus:ring-2 focus:ring-black">
                        </div>
                        <div id="admin-product-list" class="space-y-2 max-h-[55vh] overflow-y-auto pr-1">
                            <!-- Filas generadas por JS -->
                        </div>
                    </div>

                    <!-- Restauración -->
                    <div class="border-t border-gray-300 pt-4 flex justify-between items-center">
                        <span class="text-xs text-gray-500">¿Deseas vaciar las modificaciones y volver al catálogo inicial?</span>
                        <button onclick="resetToDefaults()" class="text-xs text-red-600 font-bold hover:underline">Restablecer Lista Base</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Principal JavaScript -->
    <script>
        const CONFIG_WHATSAPP_PHONE = "584120000000"; 
        const CONFIG_EMAIL_ADDRESS  = "ventas@perfumeriakanam.com"; 
        const ADMIN_PASS            = "kanam2026"; 

        const defaultProducts = [
            { id: "100536", name: "Freeze Cranby", price: 21.0, category: "Assala", image: "https://perfumeriakanam.com/wp-content/uploads/2026/10/71824_perfume-assala-prime-freeze-cranby-eau-de-parfum_z1_639155845222252786-300x300.webp" },
            { id: "100535", name: "Freeze Berry", price: 21.0, category: "Assala", image: "https://perfumeriakanam.com/wp-content/uploads/2026/10/71887_assala-freeze-berry-eau-de-parfum-85ml_l1_639155852177245848-300x300.webp" },
            { id: "100534", name: "Opulent Dubai", price: 19.5, category: "Lattafa", image: "https://perfumeriakanam.com/wp-content/uploads/2026/10/ChatGPTImageJan13_2026_03_47_26PM-300x300.png" },
            { id: "100533", name: "Freeze Cool", price: 21.0, category: "Assala", image: "https://perfumeriakanam.com/wp-content/uploads/2026/10/Cool-330x246-1-300x224.jpg" },
            { id: "100532", name: "Assala Sehr", price: 29.95, category: "Assala Prime", image: "https://perfumeriakanam.com/wp-content/uploads/2026/10/SEHR-ASSALA-AD-scaled-1-540x540.jpg" },
            { id: "100531", name: "Aquatica", price: 35.5, category: "Rayhaan", image: "https://perfumeriakanam.com/wp-content/uploads/2026/10/Rayhaan-Aquatica-100ml-EDP-by-Rayhaan-4_c0fc9693-ac0b-4a2c-adec-bf6f81cf2d86-300x300.jpg" },
            { id: "100530", name: "Cedrus Blanc", price: 35.5, category: "Rayhaan", image: "https://perfumeriakanam.com/wp-content/uploads/2026/10/cedrus_blanc_rayhaan-private-blends-australia-300x300.jpg" },
            { id: "100529", name: "Island Sun", price: 37.75, category: "Khadlaj", image: "https://perfumeriakanam.com/wp-content/uploads/2026/10/images-29-300x300.jpeg" },
            { id: "100528", name: "Muse", price: 37.75, category: "Khadlaj", image: "https://perfumeriakanam.com/wp-content/uploads/2026/10/images-28-300x300.jpeg" },
            { id: "100527", name: "Panache Angel Dust", price: 37.5, category: "Khadlaj", image: "https://perfumeriakanam.com/wp-content/uploads/2026/10/2F914145-B82F-4823-81AA-067A2FC6E5A5-540x540.jpg" },
            { id: "100526", name: "Hawas Boa", price: 45.5, category: "Rasasi", image: "https://perfumeriakanam.com/wp-content/uploads/2026/10/Gemini_Generated_Image_lnlnmqlnlnmqlnln-300x300.jpg" },
            { id: "100525", name: "Club de Nuit Intenso Fuego", price: 45.5, category: "Armaf", image: "https://perfumeriakanam.com/wp-content/uploads/2026/10/images-27-242x300.jpeg" }
        ];

        let products = [];
        let cart = {};

        function initApp() {
            try {
                const stored = localStorage.getItem('kanam_products_v3');
                if (stored) {
                    products = JSON.parse(stored);
                } else {
                    products = [...defaultProducts];
                }
            } catch(e) {
                products = [...defaultProducts];
            }

            initCategories();
            renderProducts(products);
        }

        function initCategories() {
            const select = document.getElementById('category-select');
            if(!select) return;
            select.innerHTML = '<option value="">Todas las Marcas</option>';
            const categories = [...new Set(products.map(p => p.category))].filter(Boolean);
            categories.sort().forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            if(!grid) return;
            grid.innerHTML = '';

            if(!items || items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500 font-medium">No se encontraron perfumes.</div>`;
                return;
            }

            items.forEach(product => {
                const qty = cart[product.id] ? cart[product.id].quantity : 0;
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col justify-between transition hover:shadow-md";
                
                card.innerHTML = `
                    <div>
                        <div class="h-28 sm:h-40 bg-gray-50 overflow-hidden flex items-center justify-center p-1.5">
                            <img src="${product.image}" alt="${product.name}" loading="lazy" class="h-full object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/300?text=Kanam';">
                        </div>
                        <div class="p-2 sm:p-3">
                            <span class="text-[9px] sm:text-xs font-bold text-emerald-600 uppercase tracking-wider">${product.category}</span>
                            <h3 class="font-bold text-gray-800 text-xs sm:text-sm mt-0.5 line-clamp-2 leading-snug">${product.name}</h3>
                            <p class="text-sm sm:text-base font-black text-gray-900 mt-1">$${product.price.toFixed(2)}</p>
                        </div>
                    </div>
                    <div class="p-2 sm:p-3 pt-0">
                        ${qty === 0 ? `
                            <button onclick="updateQuantity('${product.id}', 1)" class="w-full bg-black hover:bg-gray-800 text-white py-1.5 rounded-lg text-xs font-medium transition flex items-center justify-center space-x-1">
                                <i class="fa-solid fa-cart-plus"></i><span>Agregar</span>
                            </button>
                        ` : `
                            <div class="flex items-center justify-between bg-gray-100 rounded-lg p-0.5 sm:p-1">
                                <button onclick="updateQuantity('${product.id}', -1)" class="w-6 sm:w-8 h-6 sm:h-8 bg-white rounded shadow-sm font-bold text-xs sm:text-sm hover:bg-gray-200">-</button>
                                <span class="font-bold text-xs sm:text-sm">${qty}</span>
                                <button onclick="updateQuantity('${product.id}', 1)" class="w-6 sm:w-8 h-6 sm:h-8 bg-white rounded shadow-sm font-bold text-xs sm:text-sm hover:bg-gray-200">+</button>
                            </div>
                        `}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterProducts() {
            const query = (document.getElementById('search-input')?.value || '').toLowerCase();
            const category = document.getElementById('category-select')?.value || '';

            const filtered = products.filter(p => {
                const matchesQuery = p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query);
                const matchesCategory = category === "" || p.category === category;
                return matchesQuery && matchesCategory;
            });

            renderProducts(filtered);
        }

        function updateQuantity(productId, change) {
            const product = products.find(p => p.id == productId);
            if (!product) return;

            if (!cart[productId]) {
                if (change > 0) cart[productId] = { ...product, quantity: 1 };
            } else {
                cart[productId].quantity += change;
                if (cart[productId].quantity <= 0) delete cart[productId];
            }

            filterProducts();
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const badge = document.getElementById('cart-badge');
            const totalEl = document.getElementById('cart-total');
            if(!container) return;
            
            container.innerHTML = '';
            let totalItems = 0;
            let totalPrice = 0;

            const ids = Object.keys(cart);
            if (ids.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-12 text-sm">El carrito está vacío</p>`;
                if(badge) badge.textContent = '0';
                if(totalEl) totalEl.textContent = '$0.00';
                return;
            }

            ids.forEach(id => {
                const item = cart[id];
                totalItems += item.quantity;
                totalPrice += item.price * item.quantity;

                const div = document.createElement('div');
                div.className = "flex items-center justify-between border-b pb-2.5";
                div.innerHTML = `
                    <div class="flex items-center space-x-2.5">
                        <img src="${item.image}" class="w-10 h-10 object-contain bg-gray-50 rounded" onerror="this.onerror=null; this.src='https://via.placeholder.com/300?text=Kanam';">
                        <div>
                            <h4 class="font-bold text-xs line-clamp-1">${item.name}</h4>
                            <p class="text-[11px] text-gray-500">$${item.price.toFixed(2)} x ${item.quantity}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="font-bold text-xs text-emerald-600">$${(item.price * item.quantity).toFixed(2)}</span>
                        <button onclick="updateQuantity('${item.id}', -1)" class="text-red-500 hover:text-red-700 p-1 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });

            if(badge) badge.textContent = totalItems;
            if(totalEl) totalEl.textContent = `$${totalPrice.toFixed(2)}`;
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        function sendWhatsAppOrder() {
            const ids = Object.keys(cart);
            if (ids.length === 0) {
                alert("Agrega al menos un perfume al pedido.");
                return;
            }

            let msg = "Hola! 🛍️ Me gustaría realizar el siguiente pedido en *Perfumería Kanam*:\n\n";
            let total = 0;

            ids.forEach(id => {
                const item = cart[id];
                const subtotal = item.price * item.quantity;
                total += subtotal;
                msg += `▪️ *${item.name}* (x${item.quantity}) - $${subtotal.toFixed(2)}\n`;
            });

            msg += `\n*Total del Pedido: $${total.toFixed(2)}*\n\nQuedo a la espera de la confirmación.`;

            const url = `https://api.whatsapp.com/send?phone=${CONFIG_WHATSAPP_PHONE}&text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }

        function sendEmailOrder() {
            const ids = Object.keys(cart);
            if (ids.length === 0) {
                alert("Agrega al menos un perfume al pedido.");
                return;
            }

            let subject = "Nuevo Pedido de Perfumes - Perfumería Kanam";
            let body = "Hola, me gustaría realizar el siguiente pedido:\n\n";
            let total = 0;

            ids.forEach(id => {
                const item = cart[id];
                const subtotal = item.price * item.quantity;
                total += subtotal;
                body += `- ${item.name} (x${item.quantity}) - $${subtotal.toFixed(2)}\n`;
            });

            body += `\nTotal: $${total.toFixed(2)}\n\nSaludos!`;

            const mailtoUrl = `mailto:${CONFIG_EMAIL_ADDRESS}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.location.href = mailtoUrl;
        }

        function openAdminModal() {
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function checkAdminPass() {
            const input = document.getElementById('admin-pass-input').value;
            if (input === ADMIN_PASS) {
                document.getElementById('admin-login-box').classList.add('hidden');
                document.getElementById('admin-content-box').classList.remove('hidden');
                renderAdminList();
            } else {
                alert("Contraseña incorrecta.");
            }
        }

        function renderAdminList() {
            const list = document.getElementById('admin-product-list');
            const countEl = document.getElementById('admin-total-count');
            const searchVal = (document.getElementById('admin-search-input')?.value || '').toLowerCase();
            
            if (!list) return;
            list.innerHTML = '';

            const filteredAdmin = products.filter(p => p.name.toLowerCase().includes(searchVal) || p.category.toLowerCase().includes(searchVal));
            if (countEl) countEl.textContent = filteredAdmin.length;

            if (filteredAdmin.length === 0) {
                list.innerHTML = `<p class="text-center text-gray-400 py-6 text-xs">No se encontraron productos.</p>`;
                return;
            }

            filteredAdmin.forEach((prod) => {
                const item = document.createElement('div');
                item.className = "flex flex-col sm:flex-row items-center justify-between p-2.5 bg-gray-50 rounded-xl border border-gray-200 gap-2";
                item.innerHTML = `
                    <div class="flex items-center space-x-2.5 w-full sm:w-auto">
                        <img src="${prod.image}" class="w-10 h-10 object-contain bg-white rounded border p-0.5" onerror="this.onerror=null; this.src='https://via.placeholder.com/300?text=Kanam';">
                        <div>
                            <p class="font-bold text-xs text-gray-800 line-clamp-1">${prod.name}</p>
                            <span class="text-[10px] text-emerald-600 font-semibold">${prod.category}</span>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                        <div class="flex items-center">
                            <span class="text-xs font-bold mr-1 text-gray-600">$</span>
                            <input type="number" step="0.01" value="${prod.price}" id="price-input-${prod.id}" class="w-20 px-2 py-1 text-xs border rounded-lg bg-white text-right font-bold focus:outline-none focus:ring-1 focus:ring-black">
                        </div>
                        <button onclick="updatePrice('${prod.id}')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-2.5 py-1 rounded-lg font-bold transition">
                            Guardar
                        </button>
                        <button onclick="deleteProduct('${prod.id}')" class="bg-red-500 hover:bg-red-600 text-white text-xs px-2.5 py-1 rounded-lg font-bold transition">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function updatePrice(productId) {
            const inputVal = document.getElementById(`price-input-${productId}`).value;
            const newPrice = parseFloat(inputVal);
            if (isNaN(newPrice) || newPrice < 0) {
                alert("Ingresa un precio válido.");
                return;
            }

            const prod = products.find(p => p.id == productId);
            if (prod) {
                prod.price = newPrice;
                saveProductsState();
                filterProducts();
                renderAdminList();
                alert(`Precio de "${prod.name}" modificado a $${newPrice.toFixed(2)}`);
            }
        }

        function deleteProduct(productId) {
            const prod = products.find(p => p.id == productId);
            if (!prod) return;
            
            if (confirm(`¿Seguro de eliminar "${prod.name}"?`)) {
                products = products.filter(p => p.id != productId);
                saveProductsState();
                initCategories();
                filterProducts();
                renderAdminList();
            }
        }

        function addNewProduct(e) {
            e.preventDefault();
            const name = document.getElementById('new-name').value.trim();
            const category = document.getElementById('new-category').value.trim();
            const price = parseFloat(document.getElementById('new-price').value);
            const image = document.getElementById('new-image').value.trim();

            const newProd = {
                id: String(Date.now()),
                name,
                category,
                price,
                image
            };

            products.unshift(newProd);
            saveProductsState();

            document.getElementById('add-product-form').reset();
            initCategories();
            filterProducts();
            renderAdminList();
            alert("¡Perfume agregado exitosamente!");
        }

        function saveProductsState() {
            localStorage.setItem('kanam_products_v3', JSON.stringify(products));
        }

        function resetToDefaults() {
            if (confirm("¿Deseas restablecer el inventario al catálogo inicial por defecto?")) {
                localStorage.removeItem('kanam_products_v3');
                products = [...defaultProducts];
                initCategories();
                filterProducts();
                renderAdminList();
                alert("Lista de productos restablecida.");
            }
        }

        // Ejecución inmediata garantizada
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
