<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfumería Kanam - Catálogo de Pedidos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-black text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <h1 class="text-xl md:text-2xl font-bold tracking-wider">PERFUMERÍA KANAM</h1>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openAdminModal()" class="bg-gray-800 hover:bg-gray-700 text-amber-400 border border-amber-400 px-3 py-2 rounded-lg text-sm flex items-center space-x-1.5 transition">
                    <i class="fa-solid fa-lock"></i>
                    <span class="hidden md:inline">Admin</span>
                </button>
                <button onclick="toggleCart()" class="relative bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg flex items-center space-x-2 transition shadow-md">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="hidden md:inline">Ver Pedido</span>
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- Buscador y Filtros -->
        <div class="mb-8 flex flex-col md:flex-row gap-4 justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <div class="w-full md:w-1/2 relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"></i>
                <input type="text" id="search-input" placeholder="Buscar perfume por nombre..." oninput="filterProducts()" class="w-full pl-12 pr-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-black">
            </div>
            <div class="w-full md:w-1/3">
                <select id="category-select" onchange="filterProducts()" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-black bg-white">
                    <option value="">Todas las Marcas</option>
                </select>
            </div>
        </div>

        <!-- Grid de Productos -->
        <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-6">
            <div class="col-span-full text-center py-12 text-gray-500 font-medium">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i>Cargando catálogo actualizado de la nube...
            </div>
        </div>
    </main>

    <!-- Modal Admin / Contraseña -->
    <div id="admin-login-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-gray-900"><i class="fa-solid fa-shield-halved text-amber-500 mr-2"></i> Panel Administrativo</h3>
                <button onclick="closeAdminLogin()" class="text-gray-400 hover:text-black text-xl">&times;</button>
            </div>
            <p class="text-sm text-gray-600 mb-4">Ingresa la contraseña para gestionar el inventario:</p>
            <input type="password" id="admin-password-input" placeholder="Contraseña..." class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black mb-4">
            <button onclick="verifyAdminPassword()" class="w-full bg-black text-white py-2.5 rounded-lg font-bold hover:bg-gray-800 transition">Entrar al Panel</button>
        </div>
    </div>

    <!-- Modal Panel de Edición, Nuevos Productos y Eliminación -->
    <div id="admin-panel-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-3xl rounded-2xl p-6 shadow-2xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="font-bold text-lg text-gray-900"><i class="fa-solid fa-pen-to-square text-emerald-600 mr-2"></i> Administrar Inventario</h3>
                <button onclick="closeAdminPanel()" class="text-gray-400 hover:text-black text-2xl">&times;</button>
            </div>

            <!-- Sección: Añadir Nuevo Producto -->
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 mb-4">
                <h4 class="font-bold text-sm text-gray-800 mb-3"><i class="fa-solid fa-plus-circle text-emerald-600 mr-1"></i> Agregar Nuevo Perfume</h4>
                <form id="add-product-form" onsubmit="addNewProduct(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input type="text" id="new-name" placeholder="Nombre del perfume" required class="px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-black">
                    <input type="text" id="new-category" placeholder="Marca o Categoría (ej. Lattafa)" required class="px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-black">
                    <input type="number" step="0.01" id="new-price" placeholder="Precio ($)" required class="px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-black">
                    <input type="url" id="new-image" placeholder="URL de la imagen (enlace)" required class="px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-black">
                    <button type="submit" id="btn-add-submit" class="sm:col-span-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg text-sm transition">
                        <i class="fa-solid fa-cloud-arrow-up mr-1"></i> Publicar Nuevo Producto
                    </button>
                </form>
            </div>

            <!-- Buscador dentro del Admin -->
            <div class="mb-3">
                <input type="text" id="admin-search-input" placeholder="Buscar perfume existente para editar precio o eliminar..." oninput="renderAdminTable()" class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-black text-sm">
            </div>

            <div class="flex-1 overflow-y-auto space-y-3 pr-2" id="admin-products-list">
                <!-- Lista editable -->
            </div>

            <div class="mt-4 pt-3 border-t flex justify-between items-center gap-2 flex-wrap">
                <button onclick="resetDefaultProducts()" class="text-xs text-red-600 hover:underline font-medium"><i class="fa-solid fa-rotate-right mr-1"></i> Vaciar catálogo global</button>
                <div class="flex items-center space-x-2">
                    <button id="btn-save-changes" onclick="saveAdminChanges()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-emerald-700 transition text-sm flex items-center space-x-1">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>Guardar Cambios</span>
                    </button>
                    <button onclick="closeAdminPanel()" class="bg-black text-white px-4 py-2 rounded-lg font-bold hover:bg-gray-800 transition text-sm">Cerrar Panel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal / Drawer del Carrito -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col transform transition-transform">
            <div class="p-4 bg-black text-white flex justify-between items-center">
                <h2 class="text-lg font-bold"><i class="fa-solid fa-bag-shopping mr-2"></i> Tu Pedido</h2>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            
            <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Ítems del carrito -->
            </div>

            <div class="p-4 border-t bg-gray-50 space-y-2">
                <div class="flex justify-between text-lg font-bold mb-2">
                    <span>Total estimado:</span>
                    <span id="cart-total" class="text-emerald-600">$0.00</span>
                </div>
                <button onclick="sendWhatsAppOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold flex items-center justify-center space-x-2 transition shadow-lg">
                    <i class="fa-brands fa-whatsapp text-xl"></i>
                    <span>Enviar Pedido por WhatsApp</span>
                </button>
                <button onclick="copyOrderText()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 py-2.5 rounded-xl font-bold flex items-center justify-center space-x-2 transition text-sm">
                    <i class="fa-solid fa-copy"></i>
                    <span>Copiar Pedido (Para PC / Redes)</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Script de la Aplicación -->
    <script>
        // Enlace base de tu JSON en npoint.io
        const CLOUD_API_URL = "https://api.npoint.io/49b6b201b0637a4acd04";

        let products = [];
        let cart = {};
        const ADMIN_PASS = "123vladimir";

        // Cargar productos con parámetro anti-caché dinámico (evita que el navegador guarde versiones viejas)
        async function loadProductsFromCloud() {
            try {
                // Añadimos ?t=timestamp para forzar al navegador a descargar siempre la versión más nueva
                const response = await fetch(`${CLOUD_API_URL}?t=${Date.now()}`);
                if (!response.ok) throw new Error("Error de conexión");
                const cloudData = await response.json();
                
                if (Array.isArray(cloudData) && cloudData.length > 0) {
                    products = cloudData;
                } else {
                    products = [];
                }
            } catch (err) {
                console.warn("Cargando respaldo local...", err);
                products = JSON.parse(localStorage.getItem('kanam_products')) || [];
            }
            initCategories();
            filterProducts();
        }

        // Sincronizar y guardar cambios a nivel global en npoint.io
        async function syncProductsToCloud() {
            try {
                localStorage.setItem('kanam_products', JSON.stringify(products));
                const response = await fetch(CLOUD_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(products)
                });
                if (!response.ok) throw new Error("No se pudo actualizar la nube");
                return true;
            } catch (err) {
                console.error("Error sincronizando en la nube:", err);
                return false;
            }
        }

        function initCategories() {
            const select = document.getElementById('category-select');
            select.innerHTML = '<option value="">Todas las Marcas</option>';
            const categories = [...new Set(products.map(p => p.category))].filter(Boolean);
            categories.sort().forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            if(items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">No se encontraron perfumes.</div>`;
                return;
            }

            items.forEach(product => {
                const qty = cart[product.id] ? cart[product.id].quantity : 0;
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between transition hover:shadow-md";
                card.innerHTML = `
                    <div>
                        <div class="h-36 sm:h-48 bg-gray-100 overflow-hidden flex items-center justify-center p-2">
                            <img src="${product.image}" alt="${product.name}" class="h-full object-contain" onerror="this.src='https://via.placeholder.com/300?text=Perfumeria+Kanam'">
                        </div>
                        <div class="p-3 sm:p-4">
                            <span class="text-[10px] sm:text-xs font-semibold text-emerald-600 uppercase tracking-wider">${product.category}</span>
                            <h3 class="font-bold text-gray-800 text-sm sm:text-lg mt-1 line-clamp-1">${product.name}</h3>
                            <p class="text-lg sm:text-xl font-black text-gray-900 mt-1 sm:mt-2">$${Number(product.price).toFixed(2)}</p>
                        </div>
                    </div>
                    <div class="p-3 sm:p-4 pt-0">
                        ${qty === 0 ? `
                            <button onclick="updateQuantity(${product.id}, 1)" class="w-full bg-black hover:bg-gray-800 text-white py-2 rounded-lg font-medium transition flex items-center justify-center space-x-1 sm:space-x-2 text-xs sm:text-base">
                                <i class="fa-solid fa-cart-plus"></i><span>Agregar</span>
                            </button>
                        ` : `
                            <div class="flex items-center justify-between bg-gray-100 rounded-lg p-1">
                                <button onclick="updateQuantity(${product.id}, -1)" class="w-8 h-8 sm:w-10 sm:h-10 bg-white rounded-md shadow-sm font-bold hover:bg-gray-200 text-sm sm:text-base">-</button>
                                <span class="font-bold text-sm sm:text-lg">${qty}</span>
                                <button onclick="updateQuantity(${product.id}, 1)" class="w-8 h-8 sm:w-10 sm:h-10 bg-white rounded-md shadow-sm font-bold hover:bg-gray-200 text-sm sm:text-base">+</button>
                            </div>
                        `}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const category = document.getElementById('category-select').value;

            const filtered = products.filter(p => {
                const matchesQuery = p.name.toLowerCase().includes(query);
                const matchesCategory = category === "" || p.category === category;
                return matchesQuery && matchesCategory;
            });

            renderProducts(filtered);
        }

        function openAdminModal() {
            document.getElementById('admin-login-modal').classList.remove('hidden');
            document.getElementById('admin-password-input').value = '';
            document.getElementById('admin-password-input').focus();
        }

        function closeAdminLogin() {
            document.getElementById('admin-login-modal').classList.add('hidden');
        }

        function verifyAdminPassword() {
            const pass = document.getElementById('admin-password-input').value;
            if (pass === ADMIN_PASS) {
                closeAdminLogin();
                openAdminPanel();
            } else {
                alert("Contraseña incorrecta.");
            }
        }

        function openAdminPanel() {
            document.getElementById('admin-panel-modal').classList.remove('hidden');
            renderAdminTable();
        }

        function closeAdminPanel() {
            document.getElementById('admin-panel-modal').classList.add('hidden');
            initCategories();
            filterProducts(); 
            updateCartUI();
        }

        async function addNewProduct(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-add-submit');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Publicando en la nube...';

            const name = document.getElementById('new-name').value;
            const category = document.getElementById('new-category').value;
            const price = parseFloat(document.getElementById('new-price').value);
            const image = document.getElementById('new-image').value;

            const newId = Date.now(); 

            const newProd = {
                id: newId,
                name: name,
                category: category,
                price: price,
                image: image
            };

            products.unshift(newProd); 
            const synced = await syncProductsToCloud();

            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-1"></i> Publicar Nuevo Producto';

            if (synced) {
                document.getElementById('add-product-form').reset();
                renderAdminTable();
                alert("¡Perfume publicado y sincronizado en todos lados!");
            } else {
                alert("Hubo un error al conectar con la nube.");
            }
        }

        function renderAdminTable() {
            const container = document.getElementById('admin-products-list');
            const query = document.getElementById('admin-search-input').value.toLowerCase();
            container.innerHTML = '';

            const filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));

            if(filtered.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-6">No se encontraron productos.</p>`;
                return;
            }

            filtered.forEach(p => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-gray-50 p-3 rounded-xl border border-gray-100 gap-3";
                row.innerHTML = `
                    <div class="flex items-center space-x-3 flex-1">
                        <img src="${p.image}" class="w-10 h-10 object-contain bg-white rounded border" alt="" onerror="this.src='https://via.placeholder.com/300?text=Perfumeria+Kanam'">
                        <div>
                            <h4 class="font-bold text-sm line-clamp-1">${p.name}</h4>
                            <span class="text-xs text-emerald-600 font-medium">${p.category}</span>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-sm font-bold text-gray-500">$</span>
                        <input type="number" step="0.01" value="${p.price}" onchange="updateProductPrice(${p.id}, this.value)" class="w-20 px-2 py-1.5 bg-white border border-gray-300 rounded-lg text-sm font-bold text-gray-900 focus:outline-none focus:ring-2 focus:ring-black">
                        <button onclick="deleteProduct(${p.id})" class="bg-red-100 hover:bg-red-200 text-red-600 px-2.5 py-1.5 rounded-lg transition" title="Eliminar producto">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function updateProductPrice(id, newPrice) {
            const priceNum = parseFloat(newPrice);
            if (isNaN(priceNum) || priceNum < 0) return;

            const product = products.find(p => p.id === id);
            if (product) {
                product.price = priceNum;
                if (cart[id]) {
                    cart[id].price = priceNum;
                }
            }
        }

        async function saveAdminChanges() {
            const btn = document.getElementById('btn-save-changes');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Guardando...';

            const synced = await syncProductsToCloud();
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> <span>Guardar Cambios</span>';

            if (synced) {
                updateCartUI();
                alert("¡Cambios guardados y sincronizados globalmente!");
            } else {
                alert("Error al guardar en la nube.");
            }
        }

        async function deleteProduct(id) {
            if (confirm("¿Estás seguro de que deseas eliminar este perfume?")) {
                products = products.filter(p => p.id !== id);
                await syncProductsToCloud();
                
                if (cart[id]) {
                    delete cart[id];
                    updateCartUI();
                }

                renderAdminTable();
            }
        }

        async function resetDefaultProducts() {
            if (confirm("¿Deseas vaciar todo el catálogo en la nube?")) {
                products = [];
                await syncProductsToCloud();
                renderAdminTable();
                alert("¡Catálogo vaciado con éxito!");
            }
        }

        function updateQuantity(productId, change) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            if (!cart[productId]) {
                if (change > 0) {
                    cart[productId] = { ...product, quantity: 1 };
                }
            } else {
                cart[productId].quantity += change;
                if (cart[productId].quantity <= 0) {
                    delete cart[productId];
                }
            }

            filterProducts();
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const badge = document.getElementById('cart-badge');
            const totalEl = document.getElementById('cart-total');
            
            container.innerHTML = '';
            let totalItems = 0;
            let totalPrice = 0;

            const ids = Object.keys(cart);
            if (ids.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-12">Tu carrito está vacío</p>`;
                badge.textContent = '0';
                totalEl.textContent = '$0.00';
                return;
            }

            ids.forEach(id => {
                const item = cart[id];
                const currentProd = products.find(p => p.id == id);
                if(currentProd) item.price = currentProd.price;

                totalItems += item.quantity;
                totalPrice += Number(item.price) * item.quantity;

                const div = document.createElement('div');
                div.className = "flex items-center justify-between border-b pb-3";
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <img src="${item.image}" class="w-12 h-12 object-contain bg-gray-50 rounded" alt="" onerror="this.src='https://via.placeholder.com/300?text=Perfumeria+Kanam'">
                        <div>
                            <h4 class="font-bold text-sm line-clamp-1">${item.name}</h4>
                            <p class="text-xs text-gray-500">$${Number(item.price).toFixed(2)} x ${item.quantity}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="font-bold text-emerald-600">$${(Number(item.price) * item.quantity).toFixed(2)}</span>
                        <button onclick="updateQuantity(${item.id}, -1)" class="text-red-500 hover:text-red-700 p-1"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });

            badge.textContent = totalItems;
            totalEl.textContent = `$${totalPrice.toFixed(2)}`;
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
        }

        function sendWhatsAppOrder() {
            const ids = Object.keys(cart);
            if (ids.length === 0) {
                alert("Agrega al menos un producto a tu pedido.");
                return;
            }

            let message = "Hola! 🛍️ Me gustaría realizar el siguiente pedido en Perfumería Kanam:\n\n";
            let total = 0;

            ids.forEach(id => {
                const item = cart[id];
                const subtotal = Number(item.price) * item.quantity;
                total += subtotal;
                message += `▪️ *${item.name}* (x${item.quantity}) - $${subtotal.toFixed(2)}\n`;
            });

            message += `\n*Total a pagar: $${total.toFixed(2)}*\n\n¡Quedo atento a la confirmación!`;

            const phoneNumber = "17869303823"; 
            const url = `https://api.whatsapp.com/send?phone=${phoneNumber}&text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        function copyOrderText() {
            const ids = Object.keys(cart);
            if (ids.length === 0) {
                alert("El carrito está vacío.");
                return;
            }

            let message = "Hola! Me gustaría realizar este pedido en Perfumería Kanam:\n\n";
            let total = 0;

            ids.forEach(id => {
                const item = cart[id];
                const subtotal = Number(item.price) * item.quantity;
                total += subtotal;
                message += `- ${item.name} (x${item.quantity}) - $${subtotal.toFixed(2)}\n`;
            });

            message += `\nTotal: $${total.toFixed(2)}`;

            navigator.clipboard.writeText(message).then(() => {
                alert("¡Pedido copiado al portapapeles!");
            }).catch(err => {
                console.error("Error al copiar: ", err);
            });
        }

        // Carga inicial automatizada desde la nube
        loadProductsFromCloud();
    </script>
</body>
</html>
